route: "/contact/"
meta_title: "Contact No Black Swan | Discuss Your AI Project"
meta_description: "Contact No Black Swan to discuss AI readiness, workflow automation, implementation, and integration. Start with your business goals and current challenges."
sections:
  - type: "page-header"
    eyebrow: "Contact"
    h1: "Start with the business problem you want to solve."
    intro: "A discovery conversation is the entry point for working with No Black Swan. Share your business goals, current AI use, and the operational friction you want to address."
  - type: "contact"
    heading: "Discuss your AI opportunity"
    body: |
      No Black Swan works with small and midsize businesses that want a practical path from AI potential to operational use. The first conversation is an opportunity to explain how the business works today, where repetitive or manual work creates friction, what AI tools are already in use, and what you want to improve.

      You do not need to arrive with a complete AI strategy or a selected tool. A useful starting point is a specific workflow, a business goal, or a question about whether an AI opportunity is feasible. The discussion can help clarify whether assessment, advisory, implementation, automation, or ongoing support is the relevant next step.

      Email your initial inquiry with enough context to understand the problem. Avoid sending passwords, sensitive customer records, confidential employee details, or other unnecessary personal information in an initial message.
    email: "team@noblackswan.com"
    response_note: "We reply within 1 business day."
  - type: "faq"
    eyebrow: "Before you contact us"
    heading: "What to expect from the first conversation"
    items:
      - q: "How quickly will I receive a response?"
        a: "Email team@noblackswan.com. We reply within 1 business day. Include a concise description of your business and the workflow you want to improve. If a decision deadline matters, mention the date in your message."
      - q: "What information should I include?"
        a: "Explain what your business does, which workflow or operational issue you want to improve, how the process currently works, and whether any AI tools are already in use. It is helpful to describe the outcome you are trying to achieve and any known constraints. You do not need to provide a fully developed technical specification. Avoid including credentials, sensitive customer information, or confidential material that is not needed for an initial discussion."
      - q: "What happens after I make contact?"
        a: "The intended first step is a discovery conversation about your business, current AI use, operational friction, and goals. The discussion helps clarify the problem and determine a relevant next step. Depending on the situation, that may involve assessing readiness and opportunities, developing priorities, or discussing an implementation scope. The exact scope, commercial terms, and success measures need to be agreed before a specific engagement proceeds."
      - q: "Do I need to know which AI tool I want?"
        a: "No. Identifying the right opportunities before investing in tools is a central part of the service approach. You can begin with a business problem, a repetitive process, or uncertainty about where AI might help. The discussion considers the existing workflow and constraints first. Tool selection and implementation should follow the requirements of the problem, subject to feasibility and an agreed scope."
