route: "/privacy/"
meta_title: "Privacy Policy | No Black Swan"
meta_description: "How No Black Swan handles website visits and email to team@noblackswan.com. The site has no contact form and does not run advertising pixels."
sections:
  - type: "page-header"
    eyebrow: "Legal"
    h1: "Privacy notice"
    intro: "This notice explains how the No Black Swan website handles visits and email inquiries."
  - type: "rich-text"
    heading: "How this site handles information"
    body: |
      No Black Swan is the business name of The Night Ventures, LLC, doing business as No Black Swan. Questions about this notice can be sent to team@noblackswan.com. No postal address is published on this page.

      ## 1. Who this notice is for

      The website is aimed at businesses and business professionals. It is not directed at children. The company does not intend to collect information from children. If you believe a child has sent personal information to team@noblackswan.com, email that address and ask for it to be deleted.

      ## 2. What you can send

      The site does not include a contact form, file upload, or account. The only way to inquire through the site is the email link to team@noblackswan.com. If you write, you choose what to include. A useful inquiry names you, a work email address, the business, and the workflow you want to discuss.

      Do not send passwords, payment-card numbers, sensitive personal information, or confidential customer records in that first email.

      ## 3. How an inquiry is used

      Email sent to team@noblackswan.com is used to understand the request, reply, and carry on that business conversation. It is not used for unrelated promotional marketing.

      ## 4. Website visits

      The site is hosted on Vercel. The host may create technical logs, such as IP address, browser, pages requested, and timestamps, in order to operate and protect the site.

      Google Analytics 4 is not active. No measurement ID is configured, and the site does not load an analytics script while that value is empty. No advertising pixels are installed. The site does not show a cookie-consent banner, because optional analytics is not running.

      ## 5. Providers

      Hosting is provided by Vercel. The team@noblackswan.com mailbox is provided through Google Workspace.

      ## 6. Contact

      To ask a question about this notice, email team@noblackswan.com. Do not send identity documents unless a safer method has been agreed.

      ## 7. Changes

      This notice may be updated. The version on this page is the current notice.
