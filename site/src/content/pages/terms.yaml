      ## 10. Privacy and information submitted through the website

      Personal information submitted through the website or associated communications may be handled as described in the applicable privacy policy. Visitors should review that policy before providing personal information.

      Do not submit confidential, sensitive, or restricted information through a general contact method unless it is reasonably necessary and an appropriate handling process has been agreed. Visitors are responsible for ensuring they have the necessary authority to provide the information included in their communications.

      ## 11. Website availability and changes

      Website content and functionality may be revised, suspended, or withdrawn as business needs and technical requirements change. These draft terms do not promise uninterrupted availability, a particular maintenance schedule, or advance notice of every change. Where notice is legally required, the relevant obligations continue to apply.

      No Black Swan may update these terms to reflect changes in the website, service information, or applicable requirements. The published terms should carry an effective date, and material changes should be communicated where required by law.

      **[GAP: Add an effective date and confirm how revised website terms will be published and, where required, communicated to users.]**

      ## 12. Governing law and disputes

      These terms are intended to be governed by the laws of **[PLACEHOLDER: jurisdiction]**, without applying conflict-of-law rules to the extent that such exclusion is permitted. Subject to mandatory law, disputes concerning these terms would be handled by the courts or other dispute forum specified in the final, legally reviewed version.

      The appropriate governing law, venue, and dispute provisions depend on the business's legal circumstances and applicable law. No jurisdiction, county, state, court, or exclusive dispute forum has been confirmed in the supplied company information.

      **[GAP: Confirm the governing law, permitted venue, dispute-resolution requirements, and whether any mandatory consumer or other statutory provisions must be preserved.]**

      ## 13. Severability and waiver

      If a provision of these terms is found to be invalid or unenforceable, the remaining provisions should continue to apply to the extent permitted by law. The affected provision should be interpreted or replaced only as permitted under the governing law.

      A failure to exercise a right immediately does not necessarily mean that the right has been waived. Any intended waiver should be interpreted according to its actual terms and applicable law.

      ## 14. Entire agreement and separate engagements

      These terms address website use and do not, by themselves, establish the full commercial terms for consulting or implementation services. A separate agreement may be needed to define the scope of services, fees, payment arrangements, responsibilities, dependencies, success measures, intellectual property, confidentiality, data handling, support, and termination.

      Visitors should not infer a project commitment, delivery date, pricing arrangement, or service-level promise from general website descriptions. Any engagement should be documented in a form agreed by the parties.

      ## 15. Contact

      Questions concerning these website terms may be sent to team@noblackswan.com.

