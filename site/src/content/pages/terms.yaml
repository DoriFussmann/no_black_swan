      ## 1. Who operates the site

      This website is operated for No Black Swan, the business name of The Night Ventures, LLC, doing business as No Black Swan. Questions about these terms can be sent to team@noblackswan.com. No postal address is published on this page. These terms cover use of the public website. A separate written agreement governs any consulting or implementation engagement.

      Nothing on the site is an offer to deliver a particular project, a promise that a use case is feasible, or a commitment to a fee, date, or result.

      ## 2. How you may use the site

      You may use the site to learn about No Black Swan and to email a legitimate inquiry. Do not use the site in a way that breaks the law, interferes with the site, or misrepresents who you are. Do not attempt to access the hosting environment or other systems without authorization, and do not send information you are not allowed to share.

      ## 3. Content on the site

      The text, graphics, and marks on the site are provided so visitors can review the business. Unless the rights holder gives permission, or the law already allows the use, do not copy the site for a competing commercial use or suggest that No Black Swan endorses you.

      ## 4. No guarantee of results

      Service descriptions explain an approach. They do not guarantee savings, productivity, revenue, compatibility, or any other outcome. AI output can be wrong or incomplete. A business should apply its own judgment and get the specialist advice it needs before relying on a general web page.

      ## 5. Other websites

      Links to other sites are for reference. No Black Swan does not control those sites and a link is not an endorsement.

      ## 6. Liability

      To the extent the law allows, No Black Swan is not liable under these website terms for indirect or consequential loss arising from use of the public website. These terms do not exclude liability that cannot legally be excluded.

      ## 7. Changes

      The site and these terms may change. The version on this page is the current version.

      ## 8. Contact

      Email team@noblackswan.com with questions about these terms.
