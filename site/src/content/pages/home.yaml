  - type: "faq"
    eyebrow: "Frequently asked questions"
    heading: "Practical questions about AI consulting and implementation"
    intro: "Understand the starting point, the work involved, and how to decide whether an engagement fits your business."
    items:
      - q: "What does No Black Swan help businesses do?"
        a: "No Black Swan helps businesses identify, prioritize, and implement practical uses of AI. Work can include reviewing existing workflows, assessing readiness and opportunities, developing a strategy, implementing and integrating tools, automating repetitive work, and supporting adoption after deployment. The objective is to connect AI to actual business processes instead of leaving employees to experiment with disconnected tools. The specific engagement depends on the problems, constraints, and priorities of your organization."
      - q: "Is this suitable for a small or midsize business?"
        a: "The intended clients are small and midsize businesses across industries. The work is relevant when leadership sees potential in AI but needs help turning that potential into coordinated execution. You do not need to arrive with a fully developed AI strategy. A discovery conversation can establish what your team already does, where manual effort persists, what systems are involved, and which problems are important enough to investigate."
      - q: "Do we need to be using AI already?"
        a: "No existing AI program is specified as a prerequisite. Some businesses come to the work with scattered experiments; others want to assess readiness, identify valuable use cases, or decide where to start. The first conversation covers your current AI use, business goals, and operational friction. That context helps establish whether an assessment, advisory work, implementation, or another supported service is the most relevant next step."
      - q: "How do you decide which AI opportunities to pursue?"
        a: "Potential opportunities are considered against value, feasibility, risk, and effort. The aim is to identify work that fits the organization's goals and can be implemented sensibly, rather than selecting tools because they are available or attracting attention. Understanding the current workflow also matters. A seemingly simple task may depend on information, decisions, or systems elsewhere in the business, so prioritization should reflect those dependencies."
      - q: "Does No Black Swan implement solutions or only provide advice?"
        a: "The offer combines strategic prioritization with hands-on implementation. Depending on the engagement, work may progress from assessing opportunities and defining a roadmap to configuring tools, connecting systems, testing workflows, and supporting day-to-day adoption. The intention is to take ownership of execution rather than leave the business to translate recommendations into working systems alone. The actual responsibilities and deliverables are agreed as part of the engagement scope."
      - q: "Can AI be connected to our existing business systems?"
        a: "Connecting selected AI tools to existing systems and workflows is part of the implementation focus. Whether a particular integration is feasible depends on the systems involved, available connection options, the intended process, and associated constraints. The discovery and assessment work helps establish the relevant conditions before scope is agreed. No specific software compatibility or integration is guaranteed before those details have been reviewed."
      - q: "How much does an engagement cost?"
        a: "No fixed price list, rate card, or confirmed service packages are available in the supplied company information. Commercial scope is expected to depend on the work required, which may range from assessment and advisory through implementation and ongoing support. The practical starting point is a discovery call to understand the business need and determine the appropriate next step. A price should be confirmed only after the engagement scope and commercial terms have been established."
      - q: "How do we get started?"
        a: "Start by contacting No Black Swan to arrange a discovery conversation. Be prepared to describe your business, the workflows that cause friction, your current use of AI, and the result you are trying to achieve. You do not need to have selected a tool or written a complete implementation plan. The first step is to understand the problem and determine whether further assessment, advisory work, or hands-on implementation is appropriate."
