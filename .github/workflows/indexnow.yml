name: IndexNow

# After each successful production deploy of the marketing site, tell IndexNow
# (Bing and partners) which pages changed since the previous production deploy.
# Run by hand with a list of URLs to submit specific pages.
#
# Vercel reports deploys to this repository as commit statuses (context
# "Vercel"), not as GitHub deployment records, so the automatic run listens for
# the `status` event. Only a successful Vercel status on a commit that is on
# `main` counts as a production deploy; previews and failures are ignored.
on:
  status:
  workflow_dispatch:
    inputs:
      urls:
        description: "URLs or paths to submit, separated by spaces"
        required: true

# statuses: write lets the run record an "IndexNow" status on the deployed
# commit, which is how a repeated event is recognised.
permissions:
  contents: read
  statuses: write

# One run at a time per deployed commit, so repeated status events queue up
# behind the first and then find the status it recorded.
concurrency:
  group: indexnow-${{ github.event.sha || github.run_id }}
  cancel-in-progress: false

jobs:
  submit:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'status' &&
       github.event.context == 'Vercel' &&
       github.event.state == 'success' &&
       contains(github.event.branches.*.name, 'main'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Submit specific URLs
        if: github.event_name == 'workflow_dispatch'
        env:
          URLS: ${{ github.event.inputs.urls }}
        run: node site/scripts/indexnow.mjs $URLS

      - name: Submit pages changed since the previous production deploy
        if: github.event_name == 'status'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.sha }}
          REPO: ${{ github.repository }}
        run: |
          # Vercel can send more than one success status for the same commit
          # (for example after a redeploy). Handle each deployed commit once.
          handled=$(gh api "repos/$REPO/commits/$HEAD_SHA/statuses" \
            --jq '[.[] | select(.context == "IndexNow")] | length')
          if [ "$handled" != "0" ]; then
            echo "Deploy $HEAD_SHA was already handled; nothing to do."
            exit 0
          fi
          mark() {
            gh api -X POST "repos/$REPO/statuses/$HEAD_SHA" \
              -f state=success -f context=IndexNow -f description="$1" > /dev/null
          }
          if ! git merge-base --is-ancestor "$HEAD_SHA" origin/main; then
            echo "Commit $HEAD_SHA is not on main; not a production deploy."
            exit 0
          fi
          # Previous production deploy: the nearest earlier commit on main that
          # Vercel also reported as a success.
          BASE_SHA=""
          for sha in $(git rev-list --first-parent --max-count=30 "$HEAD_SHA^"); do
            state=$(gh api "repos/$REPO/commits/$sha/statuses" \
              --jq '[.[] | select(.context == "Vercel")][0].state // ""')
            if [ "$state" = "success" ]; then
              BASE_SHA="$sha"
              break
            fi
          done
          if [ -z "$BASE_SHA" ]; then
            echo "No previous production deploy found; nothing to compare."
            mark "No previous production deploy to compare against"
            exit 0
          fi
          echo "Comparing $BASE_SHA..$HEAD_SHA"
          node site/scripts/indexnow.mjs --diff "$BASE_SHA" "$HEAD_SHA"
          mark "Changed pages checked and submitted to IndexNow"
